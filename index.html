<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Challenge</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #FFF9FA;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .meta span {
      font-size: 0.85rem;
      color: #999;
    }

    .timer {
      background: #fce4ec;
      color: #E639AF;
      font-weight: 700;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }

    .timer.urgent {
      background: #fee2e2;
      color: #dc2626;
    }

    progress {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }

    progress::-webkit-progress-bar {
      background: #fce4ec;
      border-radius: 999px;
    }

    progress::-webkit-progress-value {
      background: #E639AF;
      border-radius: 999px;
      transition: width 0.3s;
    }

    .q-card {
      background: #2D1B22;
      border-radius: 24px;
      padding: 1.75rem;
      color: white;
      margin-bottom: 1.25rem;
    }

    .q-card small {
      color: #f9a8d4;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      display: block;
      margin-bottom: 0.75rem;
    }

    .q-card h2 {
      font-size: 1.1rem;
      line-height: 1.5;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-bottom: 1.25rem;
    }

    .opt {
      padding: 1rem 1.25rem;
      border-radius: 14px;
      border: 2px solid #fce4ec;
      background: white;
      font-size: 0.875rem;
      color: #2D1B22;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }

    .opt:hover:not([disabled]) {
      border-color: #E639AF;
    }

    .opt.correct {
      background: #f0fdf4;
      border-color: #4ade80;
      color: #166534;
    }

    .opt.wrong {
      background: #fff1f2;
      border-color: #f87171;
      color: #991b1b;
    }

    .opt.dimmed {
      opacity: 0.4;
    }

    .next-btn {
      width: 100%;
      padding: 1rem;
      background: #E639AF;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .next-btn:hover {
      opacity: 0.88;
    }

    .score-tag {
      font-size: 0.85rem;
      color: #999;
      margin-bottom: 1.25rem;
    }

    .score-tag span {
      color: #E639AF;
      font-weight: 700;
    }

    /* Results */
    .results {
      text-align: center;
      display: none;
    }

    .results.show {
      display: block;
    }

    .results .emoji {
      font-size: 5rem;
      margin-bottom: 1rem;
    }

    .results h2 {
      font-size: 2rem;
      color: #2D1B22;
      margin-bottom: 0.5rem;
    }

    .results p {
      color: #999;
      margin-bottom: 1.5rem;
    }

    .score-ring {
      background: #2D1B22;
      border-radius: 28px;
      padding: 2rem;
      max-width: 280px;
      margin: 0 auto 1.5rem;
    }

    .score-ring p.label {
      color: #f9a8d4;
      font-size: 0.8rem;
      margin-bottom: 0.5rem;
    }

    .score-ring p.pct {
      color: white;
      font-size: 4rem;
      font-weight: 700;
    }

    .score-ring p.msg {
      color: #f9a8d4;
      font-size: 0.875rem;
      margin-top: 0.5rem;
    }

    .restart-btn {
      padding: 0.85rem 2rem;
      background: #E639AF;
      color: white;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .quiz-wrap {}

    .quiz-wrap.hide {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="quiz-wrap" id="quizWrap">
      <div class="meta">
        <span id="qNum">1 / 8</span>
        <div class="timer" id="timer">20</div>
      </div>
      <progress id="progressBar" value="0" max="8"></progress>
      <p class="score-tag">Score: <span id="scoreDisplay">0</span></p>

      <div class="q-card">
        <small id="qLabel">Question 1</small>
        <h2 id="qText"></h2>
      </div>

      <div class="options" id="options"></div>
      <button class="next-btn" id="nextBtn" style="display:none;" onclick="nextQuestion()">Next Question →</button>
    </div>

    <div class="results" id="results">
      <div class="emoji" id="resEmoji"></div>
      <h2>Quiz Complete!</h2>
      <p id="resSubtitle"></p>
      <div class="score-ring">
        <p class="label">Your Score</p>
        <p class="pct" id="resPct"></p>
        <p class="msg" id="resMsg"></p>
      </div>
      <button class="restart-btn" onclick="restart()">🔄 Try Again</button>
    </div>
  </div>

  <script>
    const QUESTIONS = [
      { q: 'What does HTML stand for?', opts: ['HyperText Markup Language', 'HighText Machine Language', 'Hyper Transfer Markup Language', 'None of the above'], ans: 0 },
      { q: 'Which CSS property controls text size?', opts: ['font-weight', 'text-size', 'font-size', 'text-style'], ans: 2 },
      { q: 'What does CSS stand for?', opts: ['Cascading Style Sheets', 'Computer Style Sheets', 'Creative Style System', 'Colorful Style Sheets'], ans: 0 },
      { q: 'Which HTML tag creates the largest heading?', opts: ['<h6>', '<heading>', '<h1>', '<head>'], ans: 2 },
      { q: 'How do you declare a variable in JavaScript?', opts: ['variable x = 5', 'var x = 5', 'v x = 5', 'x := 5'], ans: 1 },
      { q: 'Which method adds an item to the end of an array?', opts: ['push()', 'pop()', 'append()', 'add()'], ans: 0 },
      { q: 'What does API stand for?', opts: ['Application Program Interface', 'Application Programming Interface', 'Applied Protocol Interface', 'App Processing Interface'], ans: 1 },
      { q: 'Which CSS value makes a flex container wrap?', opts: ['flex-wrap: wrap', 'flex: wrap', 'wrap: true', 'flex-flow: wrap'], ans: 0 },
    ];

    let current = 0, score = 0, selected = null, timeLeft = 20, timer = null;

    function startTimer() {
      clearInterval(timer);
      timeLeft = 20;
      updateTimer();
      timer = setInterval(() => {
        timeLeft--;
        updateTimer();
        if (timeLeft <= 0) { clearInterval(timer); autoNext(); }
      }, 1000);
    }

    function updateTimer() {
      const el = document.getElementById('timer');
      el.textContent = timeLeft;
      el.className = 'timer' + (timeLeft <= 5 ? ' urgent' : '');
    }

    function renderQ() {
      const q = QUESTIONS[current];
      document.getElementById('qNum').textContent = `${current + 1} / ${QUESTIONS.length}`;
      document.getElementById('qLabel').textContent = `Question ${current + 1}`;
      document.getElementById('qText').textContent = q.q;
      document.getElementById('progressBar').value = current;
      document.getElementById('scoreDisplay').textContent = score;
      selected = null;
      document.getElementById('nextBtn').style.display = 'none';

      const optDiv = document.getElementById('options');
      optDiv.innerHTML = q.opts.map((opt, i) => `
      <button class="opt" onclick="select(${i})">${opt}</button>
    `).join('');
      startTimer();
    }

    function select(idx) {
      if (selected !== null) return;
      clearInterval(timer);
      selected = idx;
      const q = QUESTIONS[current];
      const opts = document.querySelectorAll('.opt');
      if (idx === q.ans) score++;
      opts.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.ans) { btn.classList.add('correct'); btn.innerHTML += ' ✓'; }
        else if (i === idx) { btn.classList.add('wrong'); btn.innerHTML += ' ✗'; }
        else btn.classList.add('dimmed');
      });
      document.getElementById('scoreDisplay').textContent = score;
      const nb = document.getElementById('nextBtn');
      nb.style.display = 'block';
      nb.textContent = current + 1 >= QUESTIONS.length ? 'See Results 🎉' : 'Next Question →';
    }

    function autoNext() {
      if (selected === null) {
        const q = QUESTIONS[current];
        document.querySelectorAll('.opt').forEach((btn, i) => {
          btn.disabled = true;
          if (i === q.ans) btn.classList.add('correct');
          else btn.classList.add('dimmed');
        });
        const nb = document.getElementById('nextBtn');
        nb.style.display = 'block';
        nb.textContent = current + 1 >= QUESTIONS.length ? 'See Results 🎉' : 'Next Question →';
      }
    }

    function nextQuestion() {
      current++;
      if (current >= QUESTIONS.length) showResults();
      else renderQ();
    }

    function showResults() {
      clearInterval(timer);
      document.getElementById('quizWrap').classList.add('hide');
      const res = document.getElementById('results');
      res.classList.add('show');
      const pct = Math.round((score / QUESTIONS.length) * 100);
      document.getElementById('resEmoji').textContent = pct >= 70 ? '🎉' : pct >= 40 ? '👍' : '💪';
      document.getElementById('resSubtitle').textContent = `You scored ${score} out of ${QUESTIONS.length}`;
      document.getElementById('resPct').textContent = pct + '%';
      document.getElementById('resMsg').textContent = pct >= 70 ? 'Excellent! 🌟' : pct >= 40 ? 'Good effort!' : 'Keep practising!';
    }

    function restart() {
      current = 0; score = 0; selected = null;
      document.getElementById('results').classList.remove('show');
      document.getElementById('quizWrap').classList.remove('hide');
      renderQ();
    }

    renderQ();
  </script>
</body>

</html>
